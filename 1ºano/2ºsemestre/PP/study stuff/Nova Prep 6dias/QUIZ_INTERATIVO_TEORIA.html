<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Interativo Mestre — Teoria PP (25 Perguntas Ilustradas)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #09090b;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.12);
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.12);
            --orange: #f59e0b;
            --font-main: 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.1), transparent 30%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.08), transparent 30%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 850px;
            position: relative;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            transition: all 0.4s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #a5b4fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.88rem;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--card-border);
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--success));
            width: 0%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .question-text {
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.45;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .option {
            background: rgba(255, 255, 255, 0.02);
            border: 2px solid var(--card-border);
            padding: 18px 22px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 1.02rem;
            font-family: inherit;
            color: var(--text-main);
            text-align: left;
            transition: all 0.2s ease;
            position: relative;
            display: flex;
            align-items: center;
            line-height: 1.4;
        }

        .option:hover:not(.disabled) {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .option.correct {
            background: var(--success-bg);
            border-color: var(--success);
            color: #fff;
        }
        
        .option.wrong {
            background: var(--danger-bg);
            border-color: var(--danger);
            color: #fff;
        }
        
        .option.disabled {
            cursor: default;
            opacity: 0.75;
        }

        /* EXPLICADOR BOX (Feedback pedagógico) */
        .explanation-box {
            display: none;
            margin-top: 20px;
            padding: 18px 22px;
            border-radius: 14px;
            background: rgba(99, 102, 241, 0.08);
            border: 1px solid rgba(99, 102, 241, 0.3);
            font-size: 0.95rem;
            line-height: 1.5;
            animation: fadeIn 0.3s forwards;
        }
        .explanation-box strong { color: var(--accent); }
        .explanation-box pre {
            background: #090a0f;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px 16px;
            margin-top: 10px;
            overflow-x: auto;
            font-size: 0.88rem;
            line-height: 1.4;
        }
        .explanation-box code {
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            color: var(--success);
        }

        .controls {
            display: flex;
            justify-content: flex-end;
            margin-top: 25px;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: none;
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px var(--accent);
        }

        .btn.visible {
            display: inline-block;
        }

        .result-screen {
            text-align: center;
            display: none;
        }

        .score-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 8px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            font-size: 3.2rem;
            font-weight: 800;
            box-shadow: 0 0 40px rgba(99, 102, 241, 0.3);
        }

        .result-msg { font-size: 1.6rem; margin-bottom: 12px; font-weight: 800; }
        .result-sub { color: var(--text-muted); margin-bottom: 30px; font-size: 1.05rem; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- START SCREEN -->
        <div class="card" id="start-screen">
            <div class="header">
                <h1>Quiz Interativo Teórico PP (25 Perguntas)</h1>
                <p>Mega Quiz de Treino Intensivo com Rasteiras de Exame da Época Normal e Recurso com Código Java</p>
            </div>
            <div style="text-align: center;">
                <button class="btn visible" onclick="startQuiz()" style="padding: 18px 40px; font-size: 1.2rem;">Começar o Modo Try-Hard 🔥 (25 Perguntas)</button>
            </div>
        </div>

        <!-- QUIZ SCREEN -->
        <div class="card" id="quiz-screen" style="display: none;">
            <div class="question-header">
                <span id="q-category">Encapsulamento</span>
                <span>Pergunta <span id="q-current">1</span>/25</span>
            </div>
            
            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>

            <div class="question-text" id="q-text">
                Carregando pergunta...
            </div>

            <div class="options" id="options">
                <!-- Options injected by JS -->
            </div>

            <div class="explanation-box" id="explanation">
                <!-- Pedagogical explanation injected by JS -->
            </div>

            <div class="controls">
                <button class="btn" id="next-btn" onclick="nextQuestion()">Próxima Pergunta ➔</button>
            </div>
        </div>

        <!-- RESULT SCREEN -->
        <div class="card result-screen" id="result-screen">
            <div class="score-circle" id="score-display">0/25</div>
            <div class="result-msg" id="result-msg">Analisando resultados...</div>
            <div class="result-sub" id="result-sub"></div>
            <button class="btn visible" onclick="location.reload()">Tentar Novamente 🔄</button>
        </div>

    </div>

    <script>
        const questions = [
            {
                category: "1. Encapsulamento & Modificadores",
                text: "Explique o conceito de encapsulamento em POO. Qual a justificação arquitetural para que o acesso direto (public) aos atributos de uma classe seja considerado uma má prática?",
                options: [
                    "A) Porque o acesso público sobrecarrega a memória Stack da JVM durante a chamada de métodos.",
                    "B) Porque permite a injeção externa de estado inválido sem validação defensiva, violando a coesão e o encapsulamento do objeto.",
                    "C) Porque atributos public exigem obrigatoriamente a declaração simultânea de métodos static.",
                    "D) Porque o Java proíbe a compilação de atributos declarados como public."
                ],
                correctIndex: 1,
                explanation: `💡 <strong>Explicação 20v:</strong> Atributos <code>public</code> violam o encapsulamento pois permitem que qualquer classe cliente altere diretamente o estado interno do objeto (ex: atribuir capacidade negativa), contornando as regras de negócio.<pre><code>public class Contentor {
    private double capacidade;
    public void setCapacidade(double c) {
        if (c &lt;= 0) throw new IllegalArgumentException("Invalido");
        this.capacidade = c;
    }
}</code></pre>`
            },
            {
                category: "2. Construtores (this e super)",
                text: "Quais as restrições sintáticas aplicáveis à invocação de construtores encadeados através das palavras reservadas this() e super() em Java?",
                options: [
                    "A) Ambas as invocações têm de ser obrigatoriamente a PRIMEIRA instrução no corpo do construtor, sendo impossível utilizá-las em simultâneo no mesmo construtor.",
                    "B) O super() deve ser a primeira instrução, mas o this() pode ser chamado em qualquer linha do construtor.",
                    "C) O this() e o super() podem ser chamados em simultâneo na mesma linha separados por vírgula.",
                    "D) Servem apenas para invocar métodos estáticos da própria classe ou da superclasse."
                ],
                correctIndex: 0,
                explanation: `💡 <strong>Explicação 20v:</strong> Tanto <code>this()</code> como <code>super()</code> exigem ser estritamente a primeira linha de código dentro de um construtor. Como só pode haver uma primeira linha, é impossível invocar ambos no mesmo construtor.<pre><code>public Camiao(String mat, double tara) {
    super(mat); // PRIMEIRA LINHA OBRIGATORIA
    this.tara = tara;
}</code></pre>`
            },
            {
                category: "3. Variáveis e Métodos static",
                text: "Distinga o contexto de execução de membros de classe (static) e de instância. Por que razão a palavra reservada 'this' é proibida num método declarado como 'static'?",
                options: [
                    "A) O erro ocorre porque métodos estáticos residem na Stack e não conseguem aceder à Heap.",
                    "B) Porque métodos static pertencem à classe e podem ser executados sem qualquer objeto instanciado. Logo, não existe nenhuma 'instância atual' para a qual o this possa apontar.",
                    "C) Porque o uso do this requer obrigatoriamente a presença do modificador final nos argumentos.",
                    "D) Porque o operador this apenas pode ser utilizado dentro de interfaces."
                ],
                correctIndex: 1,
                explanation: `💡 <strong>Explicação 20v:</strong> <code>this</code> representa o endereço do próprio objeto em execução na Heap. Como métodos estáticos podem ser chamados diretamente via <code>Classe.metodo()</code> sem instanciar nenhum objeto, <code>this</code> geraria um erro de compilação.<pre><code>public static int getTotal() {
    // return this.code; -> ERRO DE COMPILACAO! 'this' proibido.
    return totalBoxes; // OK
}</code></pre>`
            },
            {
                category: "4. Modificador final",
                text: "Explique o impacto do modificador 'final'. Distinga o seu comportamento quando aplicado a um tipo primitivo versus quando aplicado a uma referência de objeto (ex: um Array).",
                options: [
                    "A) Em referências de objetos, o final congela todo o conteúdo na Heap, tornando o objeto 100% imutável.",
                    "B) Em primitivos torna o valor imutável. Em objetos, destrói a referência assim que o método termina.",
                    "C) Em objetos, impede a reatribuição da variável para outro endereço de memória (novo new), mas o estado interno do objeto permanece mutável.",
                    "D) O modificador final obriga à utilização do método clone() na Heap."
                ],
                correctIndex: 2,
                explanation: `💡 <strong>Explicação 20v:</strong> <code>final</code> numa variável de referência bloqueia a atribuição do ponteiro (não pode levar <code>new</code>), mas o interior do objeto na Heap continua mutável.<pre><code>final Contentor c = new Contentor(100);
// c = new Contentor(200); -> ERRO DE COMPILACAO!
c.setCapacidade(50); // OK! O estado interno pode mudar.</code></pre>`
            },
            {
                category: "5. Classes Abstratas vs Interfaces (Época Normal 25/26)",
                text: "Explique as diferenças estruturais entre Classes Abstratas e Interfaces em Java.",
                options: [
                    "A) Java apenas permite herança simples (extends) de uma Classe Abstrata, mas permite implementar (implements) múltiplas Interfaces.",
                    "B) Uma Interface pode ter variáveis de instância mutáveis, enquanto a Classe Abstrata apenas aceita constantes.",
                    "C) A Classe Abstrata não possui construtores, enquanto as Interfaces exigem um construtor público sem argumentos.",
                    "D) As Classes Abstratas não permitem métodos concretos com implementação."
                ],
                correctIndex: 0,
                explanation: `💡 <strong>Explicação 20v:</strong> Classes abstratas possuem herança simples (<code>extends</code>), construtores e estado mutável. Interfaces possuem herança múltipla (<code>implements</code>), não têm construtores e contêm apenas constantes.<pre><code>public abstract class Veiculo { private String code; public Veiculo(String c) { this.code = c; } }
public interface Refrigerated { double getMinTemp(); }</code></pre>`
            },
            {
                category: "6. Polimorfismo (Overloading vs Overriding)",
                text: "Distinga o Polimorfismo de Sobrecarga (Overloading) do Polimorfismo de Sobreposição (Overriding) e a fase em que a JVM efetua o binding.",
                options: [
                    "A) O Overloading requer herança e anotação @Override. O Overriding ocorre na mesma classe.",
                    "B) O Overloading resolve-se em tempo de compilação (Static Binding). O Overriding resolve-se em tempo de execução (Dynamic Binding) consoante o objeto real na Heap.",
                    "C) Ambos os mecanismos resolvem-se exclusivamente em tempo de compilação.",
                    "D) O Overriding proíbe a alteração dos parâmetros do método."
                ],
                correctIndex: 1,
                explanation: `💡 <strong>Explicação 20v:</strong> Overloading é ligação estática em compilação na mesma classe. Overriding é ligação dinâmica (<em>Dynamic Binding</em>) em runtime na subclasse dependendo da instância real na Heap.<pre><code>Veiculo v = new Camiao("C1");
v.exibirInfo(); // Dynamic Dispatch: Executa o metodo de Camiao em runtime!</code></pre>`
            },
            {
                category: "7. Upcasting e Downcasting (Época Normal 25/26)",
                text: "Aborde a conversão de tipos (casting). Discuta os riscos do Downcasting e a importância do operador instanceof.",
                options: [
                    "A) O Downcasting cria um novo objeto na memória Heap com as propriedades da subclasse.",
                    "B) O compilador valida todo o Downcasting, sendo impossível haver erro em runtime.",
                    "C) O Downcasting pode lançar uma ClassCastException em runtime se o objeto real na Heap não for da subclasse. O instanceof atua como guarda de segurança.",
                    "D) O Upcasting é perigoso e exige o bloco try-catch obrigatório."
                ],
                correctIndex: 2,
                explanation: `💡 <strong>Explicação 20v:</strong> Downcasting é a conversão explícita de superclasse para subclasse. Se o objeto na Heap não for da subclasse indicada, lança <code>ClassCastException</code>. O <code>instanceof</code> previne essa exceção.<pre><code>if (v instanceof Camiao) {
    Camiao c = (Camiao) v; // Downcasting seguro!
}</code></pre>`
            },
            {
                category: "8. Identidade vs Igualdade (Época Normal 25/26)",
                text: "Distinga a identidade física (operador ==) da igualdade lógica (método equals()). Qual a consequência de omitir a redefinição de equals()?",
                options: [
                    "A) O compilador injeta um equals() automático que compara todos os atributos da classe.",
                    "B) O método herdado de Object comportar-se-á como a identidade (==), considerando objetos iguais APENAS se partilharem o mesmo endereço de memória na Heap.",
                    "C) O programa lança uma UnsupportedOperationException ao comparar dois objetos.",
                    "D) O operador == passa a comparar o conteúdo das Strings automaticamente."
                ],
                correctIndex: 1,
                explanation: `💡 <strong>Explicação 20v:</strong> O método <code>equals()</code> herdado de <code>java.lang.Object</code> usa internamente <code>==</code>. Se não o redefinirmos na nossa classe, dois objetos distintos com atributos idênticos serão considerados erradamente diferentes.<pre><code>AidBox b1 = new AidBox("A1"); AidBox b2 = new AidBox("A1");
System.out.println(b1 == b2); // FALSE
System.out.println(b1.equals(b2)); // TRUE (com equals redefinido)</code></pre>`
            },
            {
                category: "9. Exceções e Bloco finally",
                text: "Distinga Checked Exceptions de Unchecked Exceptions. Descreva o papel do bloco finally.",
                options: [
                    "A) Checked Exceptions exigem tratamento obrigatório (try-catch/throws). O bloco finally executa SEMPRE, mesmo se houver um return no try.",
                    "B) Unchecked Exceptions exigem declaração throws obrigatoriamente. O finally só executa se não houver erro.",
                    "C) O bloco finally serve para invocar o Garbage Collector após uma exceção.",
                    "D) Checked Exceptions herdam diretamente de RuntimeException."
                ],
                correctIndex: 0,
                explanation: `💡 <strong>Explicação 20v:</strong> Checked Exceptions (herdam de <code>Exception</code>) são verificadas pelo compilador. O bloco <code>finally</code> executa garantidamente no final do bloco <code>try-catch</code>, mesmo com instrução <code>return</code> antecipada.<pre><code>try {
    return 10;
} finally {
    System.out.println("Executa SEMPRE antes de sair!");
}</code></pre>`
            },
            {
                category: "10. Tipos Enumerados (Enum)",
                text: "Avalie as caraterísticas de um Enum em Java, detalhando a regra aplicável ao seu construtor.",
                options: [
                    "A) Os construtores de um Enum são obrigatoriamente PRIVADOS, impedindo a criação externa de novos valores.",
                    "B) Os construtores de um Enum devem ser públicos para permitir a invocação via new.",
                    "C) Os Enums podem estender qualquer outra classe concreta via extends.",
                    "D) Os Enums não aceitam atributos nem métodos internos."
                ],
                correctIndex: 0,
                explanation: `💡 <strong>Explicação 20v:</strong> As constantes de um <code>enum</code> são instâncias únicas imutáveis. O construtor é obrigatoriamente <code>private</code>, impedindo a instanciação com <code>new</code> fora da própria declaração.<pre><code>public enum State {
    ENABLED("Ativo");
    private final String label;
    private State(String l) { this.label = l; } // PRIVADO
}</code></pre>`
            },
            {
                category: "11. Passagem de Argumentos (Época Normal 25/26)",
                text: "Descreva a mecânica de passagem de argumentos (pass-by-value) em Java ao passar referências de objetos para métodos.",
                options: [
                    "A) O valor do endereço de memória é copiado. Reatribuir a variável local no método não afeta o chamador, mas invocar métodos mutadores altera o objeto partilhado na Heap.",
                    "B) Em Java os objetos são passados estritamente por referência (pass-by-reference), permitindo alterar o ponteiro original.",
                    "C) A JVM cria uma cópia profunda (deep copy) de todo o objeto na Stack do método.",
                    "D) Alterar o estado do objeto dentro do método lança uma PassByValueException."
                ],
                correctIndex: 0,
                explanation: `💡 <strong>Explicação 20v:</strong> Em Java TUDO é passado por valor (<em>pass-by-value</em>). Para objetos, copia-se o valor do endereço de memória. Mutar o objeto altera a Heap; reatribuir a variável local não altera o chamador.<pre><code>public static void alterar(AidBox b) {
    b.setCapacidade(500.0); // Mutacao altera Heap!
    b = new AidBox("OUTRA"); // Reatribuicao NAO afeta o chamador!
}</code></pre>`
            },
            {
                category: "12. Composição vs Herança",
                text: "Distinga Composição ('Tem-Um') de Herança ('É-Um'). Por que razão a literatura recomenda preferir a composição?",
                options: [
                    "A) A Composição reduz o acoplamento, preserva o encapsulamento e evita o problema da superclasse frágil da Herança.",
                    "B) A Herança consome menos memória RAM do que a Composição.",
                    "C) A Composição permite utilizar múltiplos extends na mesma classe.",
                    "D) A Herança é proibida em projetos com mais de 5 classes."
                ],
                correctIndex: 0,
                explanation: `💡 <strong>Explicação 20v:</strong> Herança cria acoplamento forte entre superclasse e subclasse. A Composição (<em>'Favor composition over inheritance'</em>) mantém os objetos desacoplados e mais flexíveis em runtime.<pre><code>public class Camiao {
    private Motor motor; // Composicao: Camiao TEM UM Motor
    public Camiao(Motor m) { this.motor = m; }
}</code></pre>`
            },
            {
                category: "13. Métodos default e Conflito",
                text: "O que acontece se uma classe implementar duas interfaces que declaram o mesmo método default com a mesma assinatura?",
                options: [
                    "A) A JVM executa o primeiro método carregado no ClassLoader sem dar erro.",
                    "B) O compilador recusa compilar por ambiguidade, obrigando a classe a sobrescrever (@Override) explicitamente o método.",
                    "C) O Java cancela automaticamente a execução de ambas as interfaces.",
                    "D) É lançada uma AmbiguousMethodException em runtime."
                ],
                correctIndex: 1,
                explanation: `💡 <strong>Explicação 20v:</strong> O Problema do Diamante em métodos <code>default</code> de interfaces gera erro de compilação por ambiguidade. A classe implementadora tem de resolver a ambiguidade fazendo <code>@Override</code> explícito.<pre><code>public class Impl implements InterfaceA, InterfaceB {
    @Override
    public void log() { InterfaceA.super.log(); } // Resolucao
}</code></pre>`
            },
            {
                category: "14. String vs StringBuilder",
                text: "Justifique a obrigatoriedade do uso de StringBuilder em cenários de forte concatenação dentro de ciclos.",
                options: [
                    "A) A classe String é imutável. Concatenar Strings em ciclos cria excessivos objetos descartáveis na Heap, sobrecarregando o GC. O StringBuilder usa um buffer mutável.",
                    "B) O StringBuilder guarda o texto diretamente na memória Stack em vez da Heap.",
                    "C) Concatenar com '+' em ciclos gera uma StringOverflowException.",
                    "D) O StringBuilder invalida automaticamente o String Pool da JVM."
                ],
                correctIndex: 0,
                explanation: `💡 <strong>Explicação 20v:</strong> Como <code>String</code> é imutável, cada <code>s += "a"</code> aloca um novo objeto na Heap. O <code>StringBuilder</code> manipula um array interno mutável sem alocar novos objetos a cada iteração.<pre><code>StringBuilder sb = new StringBuilder();
for (int i=0; i&lt;100; i++) sb.append(i);
String res = sb.toString();</code></pre>`
            },
            {
                category: "15. Memória: GC e NullPointerException",
                text: "O que desencadeia a execução do Garbage Collector e qual a causa de uma NullPointerException?",
                options: [
                    "A) O GC elimina objetos sem referências ativas na Stack (inalcançáveis). O NPE ocorre ao invocar métodos/atributos numa referência que vale null.",
                    "B) O GC apaga variáveis locais da Stack. O NPE ocorre por falta de memória na RAM.",
                    "C) O NPE resulta de um atraso do Garbage Collector em apagar o objeto.",

                ],
                correctIndex: 0,
                explanation: `💡 <strong>Explicação 20v:</strong> O GC limpa objetos inalcançáveis da Heap. A <code>NullPointerException</code> acontece quando tentamos aceder a membros (<code>obj.metodo()</code>) através de uma variável de referência com valor <code>null</code>.<pre><code>AidBox b = null;
// b.getCapacity(); -> LANCA NullPointerException!</code></pre>`

            {
                category: "16. Serialização e transient",
                text: "Explique o mecanismo de Serialização e a utilidade do modificador transient.",
                options: [
                    "A) Serializar converte o estado de um objeto em fluxo de bytes (Serializable). O transient exclui atributos da serialização por segurança ou efemeridade.",
                    "B) O transient força a gravação do atributo em ficheiros de texto simples.",
                    "C) Serializar serve apenas para converter código Java em C++.",
                    "D) Atributos transient são gravados com encriptação AES nativa."
                ],
                correctIndex: 0,
                explanation: `💡 <strong>Explicação 20v:</strong> Serialização transforma objetos da Heap em bytes para gravar ou enviar pela rede. O modificador <code>transient</code> indica ao processo para ignorar esse atributo (ex: passwords).<pre><code>public class User implements Serializable {
    private static final long serialVersionUID = 1L;
    private transient String password; // Omitido da serializacao!
}</code></pre>`
            },
            {
                category: "17. I/O: Byte vs Character Streams",
                text: "Distinga Byte Streams de Character Streams na biblioteca java.io de Java.",
                options: [
                    "A) Byte Streams (InputStream/OutputStream) operam a 8 bits em dados binários. Character Streams (Reader/Writer) operam a 16 bits Unicode em texto.",
                    "B) Byte Streams operam a 32 bits e Character Streams operam a 64 bits.",
                    "C) Character Streams são exclusivos para ficheiros compactados (.zip).",
                    "D) Não há diferença; ambas as bibliotecas manipulam texto da mesma forma."
                ],
                correctIndex: 0,
                explanation: `💡 <strong>Explicação 20v:</strong> Byte Streams gerem dados binários brutos de 8 bits (imagens, áudio, zip). Character Streams gerem texto de 16 bits Unicode (UTF-8, leituras legíveis).<pre><code>FileInputStream fis = new FileInputStream("foto.png"); // 8 bits
FileReader fr = new FileReader("texto.txt"); // 16 bits Unicode</code></pre>`
            },
            {
                category: "18. Contrato equals() e hashCode()",
                text: "Qual o contrato fundamental a respeitar ao redefinir equals() e hashCode() para coleções baseadas em Hash (HashSet/HashMap)?",
                options: [
                    "A) Se dois objetos forem iguais por equals(), as suas invocações de hashCode() TÊM de devolver o mesmo número inteiro.",
                    "B) Se dois objetos tiverem o mesmo hashCode(), o método equals() tem de devolver true obrigatoriamente.",
                    "C) O hashCode() deve devolver o número de atributos privados da classe.",
                    "D) Negligenciar o hashCode() impede a compilação do projeto."
                ],
                correctIndex: 0,
                explanation: `💡 <strong>Explicação 20v:</strong> Se <code>a.equals(b)</code> der <code>true</code>, <code>a.hashCode()</code> tem estritamente de ser igual a <code>b.hashCode()</code>. Sem isso, estruturas como <code>HashSet</code> perdem objetos ou aceitam duplicados lógicos.<pre><code>@Override public boolean equals(Object o) { ... }
@Override public int hashCode() { return Objects.hash(code); }</code></pre>`
            },
            {
                category: "19. Inicialização por Defeito",
                text: "O que acontece ao tentar ler uma variável local não inicializada versus um atributo de instância não inicializado?",
                options: [
                    "A) Atributos de instância devolvem o valor por defeito (0, null, false). Variáveis locais geram Erro de Compilação.",
                    "B) Ambos devolvem null automaticamente.",
                    "C) Variáveis locais devolvem 0 e atributos de instância geram Erro de Compilação.",
                    "D) Ambas geram NullPointerException em tempo de execução."
                ],
                correctIndex: 0,
                explanation: `💡 <strong>Explicação 20v:</strong> Na Heap, atributos de classe/instância recebem inicialização por defeito automática. Na Stack, variáveis locais exigem atribuição explícita antes de qualquer leitura pelo compilador.<pre><code>private int attr; // 0 por defeito
void test() { int x; /* System.out.println(x); -> ERRO COMPILACAO */ }</code></pre>`
            },
            {
                category: "20. Wrappers e Cache Integer",
                text: "Qual o risco de comparar dois objetos Integer com o operador de identidade == fora da gama [-128, 127]?",
                options: [
                    "A) O operador == devolverá false mesmo que os valores numéricos sejam idênticos, pois aponta para objetos diferentes alocados na Heap.",
                    "B) O código lança uma IntegerOutOfBoundsException.",
                    "C) A JVM converte os números para float automaticamente.",
                    "D) Fora dessa gama o operador == funciona melhor do que dentro da gama."
                ],
                correctIndex: 0,
                explanation: `💡 <strong>Explicação 20v:</strong> A JVM mantém cache de objetos <code>Integer</code> apenas entre -128 e 127. Para números fora desse intervalo (ex: 200), <code>Integer.valueOf(200)</code> cria novos objetos na Heap, fazendo <code>a == b</code> dar <code>false</code>.<pre><code>Integer x = 200, y = 200;
System.out.println(x == y); // FALSE! (Instancias distintas na Heap)
System.out.println(x.equals(y)); // TRUE</code></pre>`
            },
            {
                category: "21. Exceções Personalizadas",
                text: "Que classe deve estender uma nova exceção personalizada para ser classificada obrigatoriamente como Checked Exception?",
                options: [
                    "A) Deve estender a classe java.lang.Exception (sem estender RuntimeException).",
                    "B) Deve estender a classe java.lang.RuntimeException.",
                    "C) Deve estender a classe java.lang.Throwable diretamente.",
                    "D) Deve estender a classe java.lang.Error."
                ],
                correctIndex: 0,
                explanation: `💡 <strong>Explicação 20v:</strong> Para ser uma Checked Exception (verificada obrigatoriamente pelo compilador), a classe deve herdar de <code>java.lang.Exception</code>. Se herdar de <code>RuntimeException</code>, torna-se Unchecked.<pre><code>public class RouteException extends Exception {
    public RouteException(String msg) { super(msg); }
}</code></pre>`
            },
            {
                category: "22. Arrays de Objetos e Nulls",
                text: "Ao executar 'Container[] arr = new Container[10];', quantas instâncias da classe Container foram alocadas na Heap?",
                options: [
                    "A) Zero instâncias de Container. Foi alocado apenas o array com 10 posições preenchidas a null.",
                    "B) 10 instâncias da classe Container com os construtores padrão.",
                    "C) 1 instância de Container contendo 10 atributos internos.",
                    "D) 10 instâncias na Stack e 1 na Heap."
                ],
                correctIndex: 0,
                explanation: `💡 <strong>Explicação 20v:</strong> Instanciar o array (<code>new Container[10]</code>) apenas reserva o espaço para 10 referências preenchidas com <code>null</code>. Cada elemento precisa de ser instanciado com <code>new ContainerImpl(...)</code>.<pre><code>Container[] arr = new Container[10]; // Reserva posicoes com NULL
arr[0] = new ContainerImpl("C1"); // Instancia o objeto individual</code></pre>`
            },
            {
                category: "23. Instanciação e GC",
                text: "O que sucede a um objeto na Heap quando todas as variáveis de referência que apontavam para ele deixam de existir?",
                options: [
                    "A) O objeto torna-se inalcançável (unreachable) e fica elegível para remoção pelo Garbage Collector.",
                    "B) O objeto é guardado no disco rígido automaticamente.",
                    "C) O objeto permanece na Heap para sempre até desligar o computador.",
                    "D) É lançada uma MemoryLeakException."
                ],
                correctIndex: 0,
                explanation: `💡 <strong>Explicação 20v:</strong> A inalcançabilidade (<em>unreachability</em>) ocorre quando já não existe nenhum caminho na Stack a apontar para o objeto na Heap. O Garbage Collector encarrega-se de libertar a memória RAM.<pre><code>AidBox b1 = new AidBox("B1");
b1 = null; // Objeto B1 fica inalcancavel -&gt; Garbage Collector limpa!</code></pre>`
            },
            {
                category: "24. Visibilidade por Defeito (Package-Private)",
                text: "Qual o alcance de acessibilidade de uma classe ou membro declarado sem modificador de acesso (default)?",
                options: [
                    "A) Visível apenas dentro das classes declaradas no mesmo pacote Java.",
                    "B) Visível para todas as subclasses do projeto em qualquer pacote.",
                    "C) Visível apenas dentro da própria classe.",
                    "D) Visível para todo o projeto desde que se faça o import."
                ],
                correctIndex: 0,
                explanation: `💡 <strong>Explicação 20v:</strong> O visibilidade por defeito (<em>package-private</em>) restringe o acesso estritamente ao mesmo pacote Java, ocultando o código para o exterior do pacote.<pre><code>class InternalHelper { // Sem modificador = package-private
    void doWork() {} // Acessivel apenas no mesmo pacote
}</code></pre>`
            },
            {
                category: "25. Regras de Arrays em Exame PP",
                text: "Nos exames de PP da ESTG, por que razão é exigido o manuseamento manual de arrays nativos com contadores em vez de ArrayList?",
                options: [
                    "A) Para avaliar a capacidade do aluno em gerir manualmente alocação de memória, controlo de índices, verificação de nulos e prevenção de NullPointerException.",
                    "B) Porque o Java deixou de suportar ArrayList nas versões recentes.",
                    "C) Porque os arrays nativos gastam mais memória do que o ArrayList.",
                    "D) Porque o ArrayList não permite guardar objetos da classe Container."
                ],
                correctIndex: 0,
                explanation: `💡 <strong>Explicação 20v:</strong> A proibição de Collections no exame visa testar rigorosamente a mestria algorítmica de arrays nativos, gestão manual de tamanho fixo, contadores de elementos e validações de <code>null</code>.<pre><code>Route[] compact = new Route[count]; // Tamanho exato sem buracos null
for (int i=0; i&lt;count; i++) compact[i] = temp[i];</code></pre>`
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        const screens = {
            start: document.getElementById('start-screen'),
            quiz: document.getElementById('quiz-screen'),
            result: document.getElementById('result-screen')
        };

        function startQuiz() {
            screens.start.style.display = 'none';
            screens.quiz.style.display = 'block';
            loadQuestion();
        }

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('q-category').textContent = q.category;
            document.getElementById('q-current').textContent = currentQuestion + 1;
            document.getElementById('q-text').textContent = q.text;
            document.getElementById('explanation').style.display = 'none';
            
            // Progress
            const progress = ((currentQuestion) / questions.length) * 100;
            document.getElementById('progress').style.width = progress + '%';

            // Options
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((opt, index) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.textContent = opt;
                div.onclick = () => selectOption(index, div);
                optionsContainer.appendChild(div);
            });

            document.getElementById('next-btn').classList.remove('visible');
            answered = false;
        }

        function selectOption(index, element) {
            if (answered) return;
            answered = true;

            const q = questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            
            options.forEach(opt => opt.classList.add('disabled'));

            if (index === q.correctIndex) {
                element.classList.add('correct');
                score++;
            } else {
                element.classList.add('wrong');
                options[q.correctIndex].classList.add('correct');
            }

            // Show educational explanation box with code snippet
            const expBox = document.getElementById('explanation');
            expBox.innerHTML = q.explanation;
            expBox.style.display = 'block';

            document.getElementById('next-btn').classList.add('visible');
            document.getElementById('progress').style.width = (((currentQuestion + 1) / questions.length) * 100) + '%';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            screens.quiz.style.display = 'none';
            screens.result.style.display = 'block';
            
            document.getElementById('score-display').textContent = score + '/25';
            
            const msg = document.getElementById('result-msg');
            const sub = document.getElementById('result-sub');
            
            if (score === 25) {
                msg.textContent = "🏆 20 VALORES PERFEITOS (25/25)!";
                sub.textContent = "Mestre Supremo da POO! A teoria não tem qualquer segredo para si. Está 100% preparado para o Exame!";
                document.getElementById('score-display').style.borderColor = "#10b981";
                document.getElementById('score-display').style.color = "#10b981";
            } else if (score >= 20) {
                msg.textContent = "🔥 Excelente Nota (Muito Bom)!";
                sub.textContent = "Excelente domínio da teoria. Releia os 1 a 2 deslizes e avance com toda a confiança para a prática!";
                document.getElementById('score-display').style.borderColor = "#6366f1";
            } else if (score >= 13) {
                msg.textContent = "👍 Aprovado, mas com Rasteiras!";
                sub.textContent = "Passou na prova teórica, mas algumas rasteiras apanharam-no. Releia as explicações pedagógicas do resumo!";
                document.getElementById('score-display').style.borderColor = "#f59e0b";
            } else {
                msg.textContent = "💀 Precisa de Rever a Teoria...";
                sub.textContent = "As rasteiras de exame dominaram este teste. Não desespere: leia o Resumo de Slides (APP01 a APP12) e tente novamente!";
                document.getElementById('score-display').style.borderColor = "#ef4444";
                document.getElementById('score-display').style.color = "#ef4444";
            }
        }
    </script>
