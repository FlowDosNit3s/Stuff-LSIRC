<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Interativo — 10 Perguntas Fatais</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #09090b;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.1);
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.1);
            --font-main: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.05), transparent 25%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
            position: relative;
        }

        /* Glassmorphism Card */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.4s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #a5b4fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Question Layout */
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--card-border);
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .question-text {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        /* Options */
        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option {
            background: rgba(255, 255, 255, 0.02);
            border: 2px solid var(--card-border);
            padding: 20px 25px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 1.1rem;
            font-family: inherit;
            color: var(--text-main);
            text-align: left;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .option::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: transparent;
            transition: background 0.2s;
        }

        .option:hover:not(.disabled) {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .option:hover:not(.disabled)::before {
            background: var(--accent);
        }

        /* States */
        .option.correct {
            background: var(--success-bg);
            border-color: var(--success);
        }
        .option.correct::before { background: var(--success); }
        
        .option.wrong {
            background: var(--danger-bg);
            border-color: var(--danger);
        }
        .option.wrong::before { background: var(--danger); }
        
        .option.disabled {
            cursor: default;
            opacity: 0.7;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: flex-end;
            margin-top: 30px;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: none; /* hidden by default */
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px var(--accent);
        }

        .btn.visible {
            display: inline-block;
            animation: fadeIn 0.4s;
        }

        /* Result Screen */
        .result-screen {
            text-align: center;
            display: none;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 8px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 3rem;
            font-weight: 800;
            box-shadow: 0 0 40px rgba(99, 102, 241, 0.3);
        }

        .result-msg {
            font-size: 1.5rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .result-sub {
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-out {
            animation: fadeOut 0.3s forwards;
        }
        
        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-10px); }
        }

        .view {
            animation: fadeIn 0.4s forwards;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- START SCREEN -->
        <div class="card view" id="start-screen">
            <div class="header">
                <h1>Teste de Conhecimentos: Top 10</h1>
                <p>Selecionámos as 10 perguntas mais sérias e cirúrgicas para o exame prático/teórico de POO.</p>
            </div>
            <div style="text-align: center;">
                <button class="btn visible" onclick="startQuiz()" style="padding: 18px 40px; font-size: 1.2rem;">Começar o Modo Try-Hard 🔥</button>
            </div>
        </div>

        <!-- QUIZ SCREEN -->
        <div class="card view" id="quiz-screen" style="display: none;">
            <div class="question-header">
                <span id="q-category">Encapsulamento</span>
                <span>Pergunta <span id="q-current">1</span>/10</span>
            </div>
            
            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>

            <div class="question-text" id="q-text">
                Qual é a pergunta?
            </div>

            <div class="options" id="options">
                <!-- Options injected by JS -->
            </div>

            <div class="controls">
                <button class="btn" id="next-btn" onclick="nextQuestion()">Próxima Pergunta ➔</button>
            </div>
        </div>

        <!-- RESULT SCREEN -->
        <div class="card view result-screen" id="result-screen">
            <div class="score-circle" id="score-display">0/10</div>
            <div class="result-msg" id="result-msg">Analisando resultados...</div>
            <div class="result-sub" id="result-sub"></div>
            <button class="btn visible" onclick="location.reload()">Tentar Novamente</button>
        </div>

    </div>

    <script>
        const questions = [
            {
                category: "1. Encapsulamento & Modificadores",
                text: "Qual é a justificação arquitetural principal para não declararmos os atributos de uma classe como 'public' em Java?",
                options: [
                    "A) O código compila mais lentamente devido ao excesso de visibilidade externa.",
                    "B) O acesso direto permite que código externo altere o estado interno com valores inválidos, quebrando as regras de negócio e violando o encapsulamento.",
                    "C) Variáveis public não podem ser instanciadas na Heap, causando memory leaks."
                ],
                correctIndex: 1
            },
            {
                category: "2. Construtores (this e super)",
                text: "No contexto da inicialização de objetos, qual destas regras de sintaxe aplica-se obrigatoriamente às invocações de this() e super()?",
                options: [
                    "A) Têm de ser obrigatoriamente a primeira instrução dentro do construtor e nunca podem ser usadas simultaneamente no mesmo construtor.",
                    "B) Podem ser chamadas em qualquer linha de código dentro do bloco try-catch do construtor.",
                    "C) O this() serve para invocar métodos estáticos da própria classe e o super() os métodos estáticos da superclasse."
                ],
                correctIndex: 0
            },
            {
                category: "3. Variáveis e Métodos static",
                text: "Porque é que a utilização da palavra reservada 'this' resulta num erro de compilação quando colocada dentro de um método declarado como 'static'?",
                options: [
                    "A) Porque métodos static pertencem à classe e podem ser executados sem existir qualquer objeto na memória, não havendo assim uma 'instância atual' para o this apontar.",
                    "B) Porque os métodos static apenas aceitam parâmetros primitivos e o this é uma referência de objeto.",
                    "C) Porque o this está exclusivamente reservado para o método equals() e para os construtores."
                ],
                correctIndex: 0
            },
            {
                category: "4. Modificador final",
                text: "O que acontece na memória quando declaramos uma variável de referência (ex: um Array) como 'final' (ex: final int[] notas = new int[5];)?",
                options: [
                    "A) O array torna-se completamente imutável. Não podemos alterar os valores guardados nas suas posições.",
                    "B) O array é apagado imediatamente pelo Garbage Collector assim que o método termina a sua execução.",
                    "C) O endereço de memória fica inalterável (não podemos fazer 'notas = new int[10]'), mas o estado interno do array PODE ser alterado livremente (ex: notas[0] = 99)."
                ],
                correctIndex: 2
            },
            {
                category: "5. Abstratas vs Interfaces",
                text: "Relativamente às restrições do Java para Classes Abstratas e Interfaces, qual das seguintes afirmações é verdadeira?",
                options: [
                    "A) Uma classe pode herdar de várias classes abstratas (herança múltipla), mas apenas implementar uma interface.",
                    "B) Uma Interface não pode declarar variáveis de instância (estado) para os objetos, enquanto uma classe Abstrata pode.",
                    "C) Nenhuma das duas estruturas permite ter métodos com código (implementados), mesmo nas versões mais recentes do Java."
                ],
                correctIndex: 1
            },
            {
                category: "6. Polimorfismo (Overload vs Override)",
                text: "Qual é a principal distinção no momento de decisão da JVM entre Overloading (Sobrecarga) e Overriding (Sobreposição)?",
                options: [
                    "A) O Overloading resolve-se estaticamente em tempo de compilação; o Overriding resolve-se dinamicamente em tempo de execução, dependendo do objeto real instanciado na Heap.",
                    "B) O Overloading exige a utilização da anotação @Override, enquanto o Overriding não necessita de nenhuma anotação explícita.",
                    "C) O Overloading permite alterar o nome do método na subclasse para o adaptar, enquanto o Overriding obriga a manter o mesmo nome mas com parâmetros diferentes."
                ],
                correctIndex: 0
            },
            {
                category: "7. Upcasting e Downcasting",
                text: "Durante a execução de um programa, ao forçarmos o Downcasting explícito de uma variável do tipo genérico Veiculo para um tipo específico Camiao (Camiao c = (Camiao) v):",
                options: [
                    "A) O objeto na memória é imediatamente clonado e convertido de forma segura para Camião.",
                    "B) O compilador Java garante matematicamente que o objeto é um Camião, não havendo qualquer perigo de crash.",
                    "C) Corremos o sério risco de sofrer uma ClassCastException, sendo vital proteger a conversão com a instrução 'if (v instanceof Camiao)'."
                ],
                correctIndex: 2
            },
            {
                category: "8. Identidade vs Igualdade",
                text: "Se criarmos uma nova classe AidBox e NÃO redefinirmos (override) o método equals() herdado da classe base Object, o que acontecerá quando compararmos duas caixas diferentes?",
                options: [
                    "A) O compilador Java emitirá um erro fatal impedindo a compilação do programa.",
                    "B) O equals() comportar-se-á exatamente como o operador '==', avaliando as caixas como iguais APENAS se ambas partilharem exatamente o mesmo endereço de memória.",
                    "C) O método equals() comparará automaticamente, por reflexão, o valor de todos os atributos que declarámos na caixa."
                ],
                correctIndex: 1
            },
            {
                category: "9. Exceções e bloco finally",
                text: "Qual a diferença fulcral entre Checked Exceptions e Unchecked Exceptions, e qual o comportamento do bloco finally?",
                options: [
                    "A) Checked Exceptions (ex: RouteException) obrigam explicitamente o programador a usar try-catch ou throws. O bloco finally executa SEMPRE, quer ocorra erro ou não.",
                    "B) Unchecked Exceptions (ex: NullPointerException) são as únicas que o compilador obriga a tratar. O bloco finally só executa se o catch falhar em apanhar o erro.",
                    "C) Checked Exceptions apenas existem para I/O. O finally é usado para forçar um crash controlado na JVM caso o erro seja irrecuperável."
                ],
                correctIndex: 0
            },
            {
                category: "10. Tipos Enumerados (Enum)",
                text: "Sobre as capacidades estruturais de um Tipo Enumerado (Enum) em Java, é correto afirmar que:",
                options: [
                    "A) Não podem conter atributos, construtores nem métodos. Servem exclusivamente para criar listas de texto imutáveis.",
                    "B) Podem ter atributos, métodos e construtores. Contudo, o seu construtor tem de ser sempre estritamente privado, impedindo a criação manual com 'new' fora da própria enumeração.",
                    "C) Podem estender (extends) outras classes e enumerados para partilhar constantes genéricas com o resto do projeto."
                ],
                correctIndex: 1
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        const screens = {
            start: document.getElementById('start-screen'),
            quiz: document.getElementById('quiz-screen'),
            result: document.getElementById('result-screen')
        };

        function startQuiz() {
            screens.start.style.display = 'none';
            screens.quiz.style.display = 'block';
            loadQuestion();
        }

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('q-category').textContent = q.category;
            document.getElementById('q-current').textContent = currentQuestion + 1;
            document.getElementById('q-text').textContent = q.text;
            
            // Progress
            const progress = ((currentQuestion) / questions.length) * 100;
            document.getElementById('progress').style.width = progress + '%';

            // Options
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((opt, index) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.textContent = opt;
                div.onclick = () => selectOption(index, div);
                optionsContainer.appendChild(div);
            });

            document.getElementById('next-btn').classList.remove('visible');
            answered = false;
        }

        function selectOption(index, element) {
            if (answered) return;
            answered = true;

            const q = questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            
            // Disable all options
            options.forEach(opt => opt.classList.add('disabled'));

            if (index === q.correctIndex) {
                element.classList.add('correct');
                score++;
            } else {
                element.classList.add('wrong');
                // Highlight correct one
                options[q.correctIndex].classList.add('correct');
            }

            document.getElementById('next-btn').classList.add('visible');
            document.getElementById('progress').style.width = (((currentQuestion + 1) / questions.length) * 100) + '%';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                // Fade out/in effect
                screens.quiz.classList.remove('view');
                void screens.quiz.offsetWidth; // trigger reflow
                screens.quiz.classList.add('view');
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            screens.quiz.style.display = 'none';
            screens.result.style.display = 'block';
            
            document.getElementById('score-display').textContent = score + '/10';
            
            const msg = document.getElementById('result-msg');
            const sub = document.getElementById('result-sub');
            
            if (score === 10) {
                msg.textContent = "🏆 20 Valores Perfeitos!";
                sub.textContent = "Mestre da POO. A teoria não tem segredos para si. Está 100% pronto para ir escrever código!";
                document.getElementById('score-display').style.borderColor = "#10b981";
                document.getElementById('score-display').style.color = "#10b981";
            } else if (score >= 7) {
                msg.textContent = "🔥 Excelente Trabalho!";
                sub.textContent = "Cometeu uns pequenos deslizes, mas o núcleo duro está lá. Revise os que errou e avance para a prática.";
            } else if (score >= 5) {
                msg.textContent = "👍 Aprovado, mas com avisos!";
                sub.textContent = "Passou na teoria, mas cuidado, algumas rasteiras apanharam-no. Leia a Cheatsheet antes de praticar.";
                document.getElementById('score-display').style.borderColor = "#fdcb6e";
            } else {
                msg.textContent = "💀 Toca a rever a Teoria...";
                sub.textContent = "O lado negro da Força (NullPointerExceptions) dominou este teste. Não avance para a prática sem ler as perguntas com calma.";
                document.getElementById('score-display').style.borderColor = "#ef4444";
                document.getElementById('score-display').style.color = "#ef4444";
            }
        }
    </script>
</body>
</html>
